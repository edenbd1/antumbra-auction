name: CI
on: [push, pull_request]
jobs:
  test:
    name: Tests, and the reference that does not fit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Release, not debug: `overflow-checks = true` is set on the release
      # profile, and a debug run exercises different arithmetic from the one
      # that ships. A wrapping bug reaching production past a green debug build
      # is the failure this ordering exists to prevent.
      - run: cargo test --release --verbose
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings

      # The committed vectors must still be what the oracle produces. Without
      # this, the vector file could be edited to match a broken implementation
      # and the differential test would go on passing — which is the one failure
      # a differential test cannot catch about itself.
      - name: The committed vectors still match their generator
        run: |
          python3 tests/gen_auction_vectors.py > /tmp/quote.txt
          diff -q /tmp/quote.txt tests/vectors/quote.txt
          echo "the oracle reproduces its vectors byte for byte"

  # The published cycle table is quoted from a grant proposal. A figure that
  # drifts is a public claim that stopped being true, and nobody notices until a
  # reader reproduces it — so it is re-measured here rather than trusted.
  cycles:
    name: Cycle counts still match CYCLES.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: RISC0
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      - name: Guest toolchain
        run: rzup install

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zkvm/target
          key: zkvm-${{ hashFiles('zkvm/**/Cargo.toml', 'src/**') }}

      - name: Measure, and fail if the published table has drifted
        working-directory: zkvm
        run: cargo run --release | tee /tmp/cycles.txt && python3 verify_cycles.py < /tmp/cycles.txt

      - name: Publish the table to the run summary
        if: always()
        run: |
          {
            echo '## Measured cycle counts'
            echo
            sed -n '/^| op |/,/^$/p' /tmp/cycles.txt
          } >> "$GITHUB_STEP_SUMMARY"

  # Documentation rots in three ways that are decidable from the tree alone: a
  # path in backticks that is not in it, a link whose target does not resolve
  # from the document carrying it, and a line citation past the end of its file.
  # This gate was added after DEPLOYMENTS.md spent several commits quoting
  # `artifacts/lez/programs/authenticated_transfer.bin` as though it were a file
  # here — it is one in logos-blockchain/logos-execution-zone, and the claim
  # around it was correct, but a reader who went looking found nothing.
  docs:
    name: The documentation points at things that exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every quoted path, link and line citation resolves
        run: |
          set -e -o pipefail
          ./scripts/check-docs.py | tee docs.out
          # Floors, because every class here can pass by matching nothing: a
          # regex that stops seeing documents reports zero failures, which is
          # the same exit code and the same green tick as a clean tree.
          p=$(sed -n 's/^examined \([0-9]*\) repository path(s), \([0-9]*\) link(s).*/\1/p' docs.out)
          l=$(sed -n 's/^examined \([0-9]*\) repository path(s), \([0-9]*\) link(s).*/\2/p' docs.out)
          [ -n "$p" ] && [ -n "$l" ] || { echo "it printed no coverage line"; exit 1; }
          [ "$p" -ge 5 ] || { echo "only $p path(s) examined, under the floor of 5: the matcher is not seeing the documents"; exit 1; }
          [ "$l" -ge 2 ] || { echo "only $l link(s) examined, under the floor of 2: the matcher is not seeing the documents"; exit 1; }

# SPEL guest for the Antumbra collateral auction program (RFP-014).
#
# Pins follow the ecosystem rather than the published releases: spel is vendored
# and repinned because the crates.io releases lag the testnet, lee_core is the
# rev the public testnet runs (v0.2.4), and ruint is held below 1.18 because the
# RISC0 guest toolchain is rustc 1.88 while 1.18+ declares MSRV 1.90.
[workspace]

[package]
name    = "antumbra-auction-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "antumbra_auction"
path = "src/bin/antumbra_auction.rs"

[dependencies]
spel-framework = { path = "../../vendor/spel/spel-framework" }
nssa_core      = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "47eba256479f6f785acbd138834340703cd03401", features = ["host"], package = "lee_core" }
risc0-zkvm     = { version = "=3.0.5", default-features = false, features = ["std"] }
antumbra       = { path = "../..", package = "antumbra-auction", default-features = false }
serde          = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
# The #[account_type] derive resolves `borsh` through proc_macro_crate, so it
# must be a declared dependency of the guest itself, not merely reachable
# through spel-framework.
borsh          = { version = "1.0", default-features = false, features = ["derive"] }
ruint          = "=1.17.2"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
